<div class="page" id="page-blackjack">

  <!-- HERO -->
  <div class="bj-hero">
    <div class="bj-hero-inner">
      <div class="bj-hero-eyebrow">Juiced Racing Stream Game</div>
      <div class="bj-hero-title">Juiced <span class="chips">Blackjack</span></div>
      <div class="bj-hero-subtitle">Live Blackjack &mdash; Subscribers Only</div>
      <div class="bj-hero-cmd">!blackjack &lt;bet&gt; &mdash; join in chat</div>
    </div>
    <div class="bj-hero-cards">
      <img src="SVG/ace_of_spades.svg"    alt="A♠" class="bj-hero-card">
      <img src="SVG/king_of_hearts.svg"   alt="K♥" class="bj-hero-card">
      <img src="SVG/queen_of_clubs.svg"   alt="Q♣" class="bj-hero-card">
      <img src="SVG/jack_of_diamonds.svg" alt="J♦" class="bj-hero-card">
      <img src="SVG/10_of_spades.svg"     alt="10♠" class="bj-hero-card bj-hero-card-back">
    </div>
  </div>

  <!-- FELT LINE -->
  <div class="bj-feltline"></div>

  <!-- STATS -->
  <div class="bj-stats">
    <div class="bj-stat-tile"><div class="bj-stat-val" id="bj-stat-hands">—</div><div class="bj-stat-label">Total Hands</div></div>
    <div class="bj-stat-tile"><div class="bj-stat-val" id="bj-stat-players">—</div><div class="bj-stat-label">Players</div></div>
    <div class="bj-stat-tile"><div class="bj-stat-val g" id="bj-stat-chips">—</div><div class="bj-stat-label" id="bj-stat-chips-label">Top Chips</div></div>
    <div class="bj-stat-tile"><div class="bj-stat-val" id="bj-stat-ach">—</div><div class="bj-stat-label">Achievements</div></div>
  </div>

  <!-- TIME TABS (above sectabs, same as lurkbait) -->
  <div class="bj-timetabs">
    <button class="bj-timetab active" onclick="bjSetTime('daily',this)">Daily</button>
    <button class="bj-timetab" onclick="bjSetTime('weekly',this)">Weekly</button>
    <button class="bj-timetab" onclick="bjSetTime('monthly',this)">Monthly</button>
    <button class="bj-timetab" onclick="bjSetTime('alltime',this)">All Time</button>
  </div>

  <!-- SECTION TABS -->
  <div class="bj-sectabs">
    <button class="bj-sectab active" onclick="bjSetSec('leaderboard',this)">&#9670; Leaderboard</button>
    <button class="bj-sectab" onclick="bjSetSec('achievements',this)">&#127942; Achievements</button>
    <button class="bj-sectab" onclick="bjSetSec('recent',this)">&#9654; Recent Hands</button>
  </div>

  <!-- LEADERBOARD PANEL -->
  <div class="bj-panel active" id="bj-panel-leaderboard">
    <div class="bj-period-nav" id="bj-period-nav" style="display:none">
      <button class="bj-period-btn" id="bj-period-prev" onclick="bjPeriodPrev()">&#8249;</button>
      <div class="bj-period-label" id="bj-period-label"></div>
      <button class="bj-period-btn" id="bj-period-next" onclick="bjPeriodNext()">&#8250;</button>
    </div>
    <div class="bj-sec-label">Chip Rankings</div>
    <div class="bj-alltime-tools" id="bj-alltime-tools" style="display:none">
      <input id="bj-alltime-search" class="bj-alltime-search" type="text"
        placeholder="Search all-time players..."
        oninput="bjAlltimeSearchChanged(this.value)"
        autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      <div class="bj-alltime-meta" id="bj-alltime-meta"></div>
    </div>
    <div class="bj-ldr-wrap">
      <div class="bj-ldr-row bj-ldr-head">
        <div class="bj-ldr-hcell"></div>
        <div class="bj-ldr-hcell">Player</div>
        <div class="bj-ldr-hcell r" id="bj-ldr-hcell-val">Chips</div>
        <div class="bj-ldr-hcell r">Hands</div>
      </div>
      <div id="bj-ldr-body"></div>
    </div>
    <div class="bj-loadmore-wrap" id="bj-loadmore-wrap" style="display:none">
      <button class="bj-loadmore-btn" onclick="bjLoadMore()">Load 50 More</button>
    </div>
  </div>

  <!-- ACHIEVEMENTS PANEL -->
  <div class="bj-panel" id="bj-panel-achievements">
    <div class="bj-ach-layout">

      <!-- Category nav -->
      <div class="bj-ach-catnav">
        <div class="bj-ach-catnav-title">Category</div>
        <button class="bj-ach-catbtn active" id="bj-ach-cat-all"         onclick="bjAchSetCat('all',this)">All         <span class="bj-ach-cnt" id="bj-ach-cnt-all">—</span></button>
        <button class="bj-ach-catbtn"        id="bj-ach-cat-naturals"    onclick="bjAchSetCat('naturals',this)">Naturals    <span class="bj-ach-cnt" id="bj-ach-cnt-naturals"></span></button>
        <button class="bj-ach-catbtn"        id="bj-ach-cat-streaks"     onclick="bjAchSetCat('streaks',this)">Streaks     <span class="bj-ach-cnt" id="bj-ach-cnt-streaks"></span></button>
        <button class="bj-ach-catbtn"        id="bj-ach-cat-betting"     onclick="bjAchSetCat('betting',this)">Betting     <span class="bj-ach-cnt" id="bj-ach-cnt-betting"></span></button>
        <button class="bj-ach-catbtn"        id="bj-ach-cat-balance"     onclick="bjAchSetCat('balance',this)">Balance     <span class="bj-ach-cnt" id="bj-ach-cnt-balance"></span></button>
        <button class="bj-ach-catbtn"        id="bj-ach-cat-volume"      onclick="bjAchSetCat('volume',this)">Volume      <span class="bj-ach-cnt" id="bj-ach-cnt-volume"></span></button>
        <button class="bj-ach-catbtn"        id="bj-ach-cat-situational" onclick="bjAchSetCat('situational',this)">Situational <span class="bj-ach-cnt" id="bj-ach-cnt-situational"></span></button>
        <button class="bj-ach-catbtn"        id="bj-ach-cat-poker"       onclick="bjAchSetCat('poker',this)">Poker       <span class="bj-ach-cnt" id="bj-ach-cnt-poker"></span></button>
        <div class="bj-ach-catdiv"></div>
        <div class="bj-ach-catnav-title" style="margin-top:8px">Tier</div>
        <button class="bj-ach-tierbtn t-all    active" id="bj-ach-tier-all"    onclick="bjAchSetTier('all',this)">All    <span class="bj-ach-cnt">—</span></button>
        <button class="bj-ach-tierbtn t-gold"          id="bj-ach-tier-gold"   onclick="bjAchSetTier('gold',this)">Gold   <span class="bj-ach-cnt" id="bj-ach-tier-cnt-gold"></span></button>
        <button class="bj-ach-tierbtn t-silver"        id="bj-ach-tier-silver" onclick="bjAchSetTier('silver',this)">Silver <span class="bj-ach-cnt" id="bj-ach-tier-cnt-silver"></span></button>
        <button class="bj-ach-tierbtn t-bronze"        id="bj-ach-tier-bronze" onclick="bjAchSetTier('bronze',this)">Bronze <span class="bj-ach-cnt" id="bj-ach-tier-cnt-bronze"></span></button>
      </div>

      <!-- Achievement wall -->
      <div class="bj-ach-main">
        <div class="bj-alltime-tools" style="margin-bottom:14px">
          <input id="bj-ach-search" class="bj-alltime-search" type="text"
            placeholder="Search players..."
            oninput="bjAchSearch(this.value)"
            autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
          <div class="bj-alltime-meta" id="bj-ach-search-result"></div>
        </div>
        <div id="bj-ach-player-list" style="display:none;flex-direction:column;margin-bottom:14px"></div>
        <div class="bj-sec-label" id="bj-ach-wall-label">All Achievements</div>
        <div class="bj-ach-grid" id="bj-ach-wall"></div>
      </div>

      <!-- Sidebar -->
      <div class="bj-ach-sidebar">
        <div class="bj-sec-label" style="margin-bottom:12px">Most Decorated</div>
        <div class="bj-ach-top-card" id="bj-ach-top-total"></div>
        <div class="bj-ach-top-card" id="bj-ach-top-gold" style="margin-bottom:20px"></div>
        <div class="bj-sec-label">Recent Unlocks</div>
        <div id="bj-ach-recent"></div>
      </div>

    </div>
  </div>

  <!-- RECENT HANDS PANEL -->
  <div class="bj-panel" id="bj-panel-recent">
    <div class="bj-sec-label" id="bj-recent-label">Recent Hands</div>
    <div class="bj-recent-feed" id="bj-recent-feed"></div>
  </div>

</div>
